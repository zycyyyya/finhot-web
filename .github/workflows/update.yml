name: Validate and Update Data

on:
  workflow_dispatch:
  schedule:
    # GitHub schedule is best-effort rather than a precise clock. Keep the 08:15
    # Beijing primary run and add three off-peak safety runs to reduce missed feeds.
    - cron: "15 0 * * *"  # 08:15 Asia/Shanghai (primary)
    - cron: "17 4 * * *"  # 12:17 Asia/Shanghai
    - cron: "19 8 * * *"  # 16:19 Asia/Shanghai
    - cron: "21 12 * * *" # 20:21 Asia/Shanghai

concurrency:
  group: finhot-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run validation tests
        run: npm run check

      - name: Fetch and validate data
        id: fetch
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FINHOT_TRIGGER_EVENT: ${{ github.event_name }}
          FINHOT_SCHEDULE: ${{ github.event.schedule || '' }}
          FINHOT_RUN_ID: ${{ github.run_id }}
          # Run the LLM on the 08:15 primary schedule and manual runs. Safety
          # schedules update feeds/history while reusing evidence-validated AI output.
          FINHOT_ANALYSIS_MODE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '15 0 * * *') && 'full' || 'cached' }}
        run: npm run fetch

      - name: Write data health summary
        if: always()
        run: node scripts/health-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finhot-source-health-${{ github.run_id }}
          path: reports/source-health.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Re-run validation after generation
        if: success()
        run: npm run check

      - name: Commit updated data when changed
        if: success()
        run: |
          if git diff --quiet -- data.js data/history.json data/events.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js data/history.json data/events.json
          git commit -m "chore: update finhot data"
          git push
