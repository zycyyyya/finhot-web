<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>finhot — 金融保险圈精选资讯</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="header-logo">finhot</a>
  <div class="header-spacer"></div>
  <nav class="header-nav">
    <a href="index.html" class="active" id="navFeatured">精选</a>
    <a href="daily.html">AI 日报</a>
    <a href="about.html">关于</a>
  </nav>
</header>

<div class="macro-board-wrap">
  <section class="macro-board" id="macroBoard" aria-label="宏观政策参考看板" hidden>
    <div class="macro-board-head">
      <div class="macro-board-heading">
        <span class="macro-board-name">宏观参考看板</span>
        <span class="macro-board-issue"></span>
      </div>
    </div>
    <div class="macro-kpi-grid"></div>
  </section>
</div>

<div class="filter-shell">
  <div class="category-bar" id="categoryBar" aria-label="业务场景"></div>
  <div class="content-filter-bar" id="contentFilterBar" aria-label="内容属性"></div>
</div>

<div class="content">
  <div class="content-wrapper">
    <div class="time-divider">
      <span class="time-label" id="timeLabel">加载中…</span>
      <span class="time-label" id="countLabel" style="margin-left:auto;color:var(--text-dim);font-weight:400;"></span>
      <div class="time-line"></div>
    </div>
    <div id="newsFeed"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="scripts/macro-view.js"></script>
<script>
(function() {
  var data = window.FINHOT_DATA;
  if (window.MacroBoard) {
    window.MacroBoard.render('macroBoard', data && data.macro);
  }
  var categories = window.CATEGORIES;
  var contentFilters = window.CONTENT_FILTERS;
  var config = window.CATEGORY_CONFIG;
  var defaultCategories = [
    { slug: 'featured', label: '今日精选' },
    { slug: 'insurance', label: '保险' },
    { slug: 'privateFundSales', label: '私募' },
    { slug: 'marketEducation', label: '投教' },
    { slug: 'all', label: '全部' }
  ];
  var defaultContentFilters = [
    { slug: 'all', label: '全部内容' },
    { slug: 'official', label: '官方监管' },
    { slug: 'products', label: '产品动态' },
    { slug: 'industry', label: '行业动态' },
    { slug: 'research', label: '深度研究' },
    { slug: 'flash', label: '快讯' },
    { slug: 'insights', label: '观点' },
    { slug: 'authoritative', label: '仅看权威源' }
  ];

  if (!Array.isArray(categories) || !categories.some(function(cat) { return cat.slug === 'insurance'; })) {
    categories = defaultCategories;
  }
  if (!Array.isArray(contentFilters)) contentFilters = defaultContentFilters;

  // XSS protection
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    if (typeof value !== 'string' || !value.trim()) return '';
    try {
      var parsed = new URL(value, window.location.href);
      return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : '';
    } catch(e) {
      return '';
    }
  }

  // Pagination
  var PAGE_SIZE = 20;
  var currentFiltered = [];
  var currentPage = 0;
  var activePrimaryFilter = 'featured';
  var activeContentFilter = 'all';

  var timeLabel = document.getElementById('timeLabel');
  var countLabel = document.getElementById('countLabel');
  var newsFeed = document.getElementById('newsFeed');
  var navFeatured = document.getElementById('navFeatured');

  // Fallback: if data.js failed to load
  if (!data || !Array.isArray(data.items) || !Array.isArray(categories) || !Array.isArray(contentFilters) || !config) {
    timeLabel.textContent = '数据加载失败';
    var errorMessage = document.createElement('p');
    errorMessage.className = 'empty-message';
    errorMessage.textContent = '数据加载失败，请稍后刷新页面';
    newsFeed.replaceChildren(errorMessage);
    return;
  }

  var featuredThreshold = 70;
  var catBar = document.getElementById('categoryBar');
  var contentFilterBar = document.getElementById('contentFilterBar');

  function activateButton(container, button, selector) {
    var buttons = container.querySelectorAll(selector);
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.remove('active');
      buttons[i].setAttribute('aria-pressed', 'false');
    }
    button.classList.add('active');
    button.setAttribute('aria-pressed', 'true');
  }

  function buildCategoryBar() {
    catBar.replaceChildren();
    categories.forEach(function(cat) {
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'cat-tab' + (cat.slug === activePrimaryFilter ? ' active' : '');
      tab.textContent = cat.label;
      tab.setAttribute('data-cat', cat.slug);
      tab.setAttribute('aria-pressed', cat.slug === activePrimaryFilter ? 'true' : 'false');
      tab.addEventListener('click', function() {
        activePrimaryFilter = cat.slug;
        activateButton(catBar, tab, '.cat-tab');
        navFeatured.classList.toggle('active', cat.slug === 'featured');
        renderFeed(false);
      });
      catBar.appendChild(tab);
    });
  }

  function buildContentFilterBar() {
    contentFilterBar.replaceChildren();
    contentFilters.forEach(function(filter) {
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'content-filter-tab' + (filter.slug === activeContentFilter ? ' active' : '');
      tab.textContent = filter.label;
      tab.setAttribute('data-content-filter', filter.slug);
      tab.setAttribute('aria-pressed', filter.slug === activeContentFilter ? 'true' : 'false');
      tab.addEventListener('click', function() {
        activeContentFilter = filter.slug;
        activateButton(contentFilterBar, tab, '.content-filter-tab');
        renderFeed(false);
      });
      contentFilterBar.appendChild(tab);
    });
  }

  navFeatured.addEventListener('click', function(e) {
    e.preventDefault();
    activePrimaryFilter = 'featured';
    navFeatured.classList.add('active');
    var featuredTabEl = catBar.querySelector('.cat-tab[data-cat="featured"]');
    if (featuredTabEl) activateButton(catBar, featuredTabEl, '.cat-tab');
    renderFeed(false);
  });

  var otherNavLinks = document.querySelectorAll('.header-nav a:not(#navFeatured)');
  for (var n = 0; n < otherNavLinks.length; n++) {
    otherNavLinks[n].addEventListener('click', function() {
      navFeatured.classList.remove('active');
    });
  }

  buildCategoryBar();
  buildContentFilterBar();

  // Time label
  try {
    timeLabel.textContent = data.date || '今日';
  } catch(e) {
    timeLabel.textContent = '今日资讯';
  }

  // === 时间口径：统一按北京时间 ===
  // 数据里存的是绝对时刻（UTC ISO），但这个站点的语义是「北京时间」：
  // 采集源是国内媒体，发布时间都是北京时间墙上时钟。
  // 若直接用浏览器本地时区渲染，处在非 UTC+8 的机器上会看到差几小时的钟面；
  // 排序口径也会跟着漂移。所以这里显式固定 +08:00，不依赖浏览器时区。
  var CN_OFFSET_MS = 8 * 3600000;

  // 把绝对时刻换算成「北京墙上时钟」的各字段
  function beijingParts(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    var s = new Date(d.getTime() + CN_OFFSET_MS);
    return {
      y: s.getUTCFullYear(),
      mo: s.getUTCMonth() + 1,
      d: s.getUTCDate(),
      h: s.getUTCHours(),
      mi: s.getUTCMinutes()
    };
  }

  // === 未来时间戳自愈（幂等） ===
  // 源站给的是北京时间墙上时钟（无时区串），历史上被 CI（TZ=UTC）当成 UTC 存，
  // 整整多了 8 小时，于是渲染出来是「比当下还晚几小时」的时间戳 —— 既霸榜又误导。
  //
  // 这里的判据很硬：**一条资讯不可能发布于未来**。所以只要时间戳超过
  // 当前时刻 2 小时（容差，避开时钟漂移），就认定它是被多加了 8 小时，
  // 直接回退 8 小时。
  //
  // 为什么幂等：已经修好的值不会落在未来，所以不会再触发第二次回退；
  // 而坏值修一次就对了。这是纯函数式的自愈，不需要等 CI 重采覆盖。
  var FUTURE_TOLERANCE_MS = 2 * 3600000;

  function normalizeStamp(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return null;
    if (t > Date.now() + FUTURE_TOLERANCE_MS) {
      return t - CN_OFFSET_MS;
    }
    return t;
  }

  // 排序键：规范化后的绝对时刻 + 固定偏移。因为偏移对所有条目一致，
  // 排序结果与「按北京墙上时钟排序」完全等价，但避免了逐条格式化带来的开销。
  function timeSortKey(iso) {
    var t = normalizeStamp(iso);
    if (t === null) return 0;
    return t + CN_OFFSET_MS;
  }

  function formatTime(iso) {
    try {
      var raw = new Date(iso).getTime();
      if (isNaN(raw)) return '';
      var now = Date.now();
      // 先自愈再算差值，否则差值恒为负，走不进下面的相对时间分支。
      var fixed = normalizeStamp(iso);
      var diff = now - fixed;
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      var q = beijingParts(iso);
      if (!q) return '';
      return q.mo + '月' + q.d + '日';
    } catch(e) {
      return '';
    }
  }

  var sceneLabels = {
    insurance: '保险',
    privateFundSales: '私募',
    marketEducation: '投教'
  };

  function effectivePrimaryScene(item) {
    if (sceneLabels[item.primaryScene]) return item.primaryScene;
    var scores = item.scenarioScores || {};
    return Object.keys(sceneLabels).sort(function(left, right) {
      var leftScore = scores[left] && Number(scores[left].score) || 0;
      var rightScore = scores[right] && Number(scores[right].score) || 0;
      return rightScore - leftScore;
    })[0] || 'marketEducation';
  }

  function isFeatured(item) {
    return typeof item.selectedForFeatured === 'boolean'
      ? item.selectedForFeatured
      : Number(item.score) >= featuredThreshold;
  }

  function primaryMatches(item, filter) {
    if (filter === 'all') return true;
    if (filter === 'featured') return isFeatured(item);
    return effectivePrimaryScene(item) === filter;
  }

  function contentMatches(item, filter) {
    if (filter === 'all') return true;
    var tags = Array.isArray(item.contentTags) ? item.contentTags : [];
    if (filter === 'official') return tags.indexOf('官方监管') >= 0 || item.category === 'regulatory';
    if (filter === 'products') return tags.indexOf('产品动态') >= 0 || item.category === 'products';
    if (filter === 'industry') return tags.indexOf('行业动态') >= 0 || item.category === 'industry';
    if (filter === 'research') return tags.indexOf('深度研究') >= 0 || item.category === 'research';
    if (filter === 'flash') return tags.indexOf('快讯') >= 0 || item.evidenceType === 'news_flash';
    if (filter === 'insights') return tags.indexOf('观点') >= 0 || item.category === 'insights';
    if (filter === 'authoritative') return tags.indexOf('权威源') >= 0 || item.sourceTier === 'S0' || item.tier === 'S0';
    return true;
  }

  function updateContentFilterAvailability(primaryItems) {
    contentFilters.forEach(function(filter) {
      var button = contentFilterBar.querySelector('[data-content-filter="' + filter.slug + '"]');
      if (!button) return;
      var count = filter.slug === 'all'
        ? primaryItems.length
        : primaryItems.filter(function(item) { return contentMatches(item, filter.slug); }).length;
      button.hidden = count === 0 && filter.slug !== 'all' && filter.slug !== activeContentFilter;
      button.setAttribute('aria-label', filter.label + '，' + count + '条');
      button.title = count + ' 条';
    });
  }

  function createCard(item) {
    var safeUrl = safeHttpUrl(item.sourceUrl);
    var card = document.createElement(safeUrl ? 'a' : 'article');
    card.className = 'news-card';
    if (safeUrl) {
      card.href = safeUrl;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
    } else {
      card.classList.add('news-card-disabled');
    }

    var catCfg = config[item.category] || {};
    var allowedTagClasses = ['tag-regulatory', 'tag-products', 'tag-industry', 'tag-research', 'tag-insights'];
    var tagClass = allowedTagClasses.indexOf(catCfg.tagClass) >= 0 ? catCfg.tagClass : '';
    var tags = Array.isArray(item.tags) ? item.tags : [];
    var sourceTier = item.sourceTierLabel || item.sourceTier || '';
    var why = Array.isArray(item.why) ? item.why : [];
    var scoreTitle = item.scoreBreakdown
      ? '相关性 ' + item.scoreBreakdown.relevance + '/30，业务影响 ' + item.scoreBreakdown.impact + '/25，可核验要素 ' + item.scoreBreakdown.evidence + '/20，时效 ' + item.scoreBreakdown.recency + '/15，可行动性 ' + item.scoreBreakdown.actionability + '/10'
        + (typeof item.tierGate === 'number' ? '；入选门槛 ' + item.tierGate + '（' + (item.sourceTier || '') + '）' : '')
        + (Array.isArray(item.noiseCaps) && item.noiseCaps.length ? '；命中噪声限制：' + item.noiseCaps.join('、') : '')
      : '';
    var scoreBadge = item.score >= featuredThreshold
      ? '<span class="card-score card-score-featured" title="' + escapeHtml(scoreTitle) + '">' + escapeHtml(item.scoreLabel || '从业价值') + ' ' + item.score + '</span>'
      : '<span class="card-score" title="' + escapeHtml(scoreTitle) + '">' + escapeHtml(item.scoreLabel || '从业价值') + ' ' + item.score + '</span>';
    var scenarioScores = item.scenarioScores || {};
    var primaryScene = effectivePrimaryScene(item);
    var primaryValue = scenarioScores[primaryScene] || {};
    var primaryReasons = Array.isArray(primaryValue.reasons) ? primaryValue.reasons.join('；') : '';
    var primaryBadge = '<span class="primary-scene-badge primary-scene-' + escapeHtml(primaryScene) + '" title="主场景：' + escapeHtml(primaryReasons) + '">' + escapeHtml(sceneLabels[primaryScene]) + '主场景' + (typeof primaryValue.score === 'number' ? ' ' + primaryValue.score : '') + '</span>';
    var secondaryBadges = Object.keys(sceneLabels).filter(function(scene) {
      return scene !== primaryScene;
    }).map(function(scene) {
      var value = scenarioScores[scene];
      if (!value || typeof value.score !== 'number' || value.score < 40) return '';
      var reasons = Array.isArray(value.reasons) ? value.reasons.join('；') : '';
      return '<span class="scenario-score" title="兼容场景：' + escapeHtml(reasons) + '">' + escapeHtml(sceneLabels[scene]) + ' ' + value.score + '</span>';
    }).join('');
    var scenarioBadges = primaryBadge + secondaryBadges;

    card.innerHTML =
      '<div class="card-meta">' +
        '<span class="card-time">' + formatTime(item.publishedAt) + '</span>' +
        '<span class="card-source">' + escapeHtml(item.sourceName || '') + '</span>' +
        (sourceTier ? '<span class="source-tier">' + escapeHtml(sourceTier) + '</span>' : '') +
        scoreBadge +
        '<span class="meta-spacer"></span>' +
      '</div>' +
      '<h2 class="card-title">' + escapeHtml(item.title || '') + '</h2>' +
      '<p class="card-summary">' + escapeHtml(item.summary || '') + '</p>' +
      (scenarioBadges ? '<div class="scenario-score-row">' + scenarioBadges + '</div>' : '') +
      (why.length ? '<div class="why-row">' + why.map(function(w) { return '<span class="why-chip">' + escapeHtml(w) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="tag-row">' +
        tags.map(function(t) { return '<span class="tag ' + tagClass + '">' + escapeHtml(t) + '</span>'; }).join('') +
      '</div>';

    return card;
  }

  function sortByTimeDesc(items) {
    // 排序键已含未来时间戳自愈（normalizeStamp），这里只管按北京时间倒序。
    return items.slice().sort(function(a, b) {
      return timeSortKey(b.publishedAt) - timeSortKey(a.publishedAt);
    });
  }

  function renderFeed(append) {
    if (!append) {
      newsFeed.replaceChildren();
      currentPage = 0;
      var primaryItems = data.items.filter(function(item) {
        return primaryMatches(item, activePrimaryFilter);
      });
      if (activeContentFilter !== 'all' && !primaryItems.some(function(item) {
        return contentMatches(item, activeContentFilter);
      })) {
        activeContentFilter = 'all';
        var allContentTab = contentFilterBar.querySelector('[data-content-filter="all"]');
        if (allContentTab) activateButton(contentFilterBar, allContentTab, '.content-filter-tab');
      }
      updateContentFilterAvailability(primaryItems);
      currentFiltered = primaryItems.filter(function(item) {
        return contentMatches(item, activeContentFilter);
      });
      currentFiltered = sortByTimeDesc(currentFiltered);
      var primaryLabel = categories.filter(function(cat) { return cat.slug === activePrimaryFilter; })[0];
      var contentLabel = contentFilters.filter(function(filter) { return filter.slug === activeContentFilter; })[0];
      countLabel.textContent = currentFiltered.length + ' 条';
      countLabel.title = (primaryLabel ? primaryLabel.label : '') + ' / ' + (contentLabel ? contentLabel.label : '');
    }

    var start = currentPage * PAGE_SIZE;
    var end = start + PAGE_SIZE;
    var pageItems = currentFiltered.slice(start, end);
    pageItems.forEach(function(item) { newsFeed.appendChild(createCard(item)); });
    currentPage++;

    var oldBtn = document.getElementById('loadMoreBtn');
    if (oldBtn) oldBtn.remove();

    if (end < currentFiltered.length) {
      var btn = document.createElement('button');
      btn.id = 'loadMoreBtn';
      btn.className = 'load-more-btn';
      btn.textContent = '加载更多 (' + (currentFiltered.length - end) + ' 条)';
      btn.addEventListener('click', function() { renderFeed(true); });
      newsFeed.appendChild(btn);
    }

    if (currentFiltered.length === 0) {
      var emptyMessage = document.createElement('p');
      emptyMessage.className = 'empty-message';
      emptyMessage.textContent = '暂无相关资讯';
      newsFeed.replaceChildren(emptyMessage);
      countLabel.textContent = '';
    }
  }

  // Default state matches the highlighted header navigation.
  renderFeed(false);
})();
</script>

</body>
</html>
