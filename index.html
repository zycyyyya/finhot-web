<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>finhot — 金融保险圈精选资讯</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="header-logo">finhot</a>
  <div class="header-spacer"></div>
  <nav class="header-nav">
    <a href="index.html" class="active" id="navFeatured">精选</a>
    <a href="daily.html">AI 日报</a>
    <a href="about.html">关于</a>
  </nav>
</header>

<div class="category-bar" id="categoryBar"></div>

<div class="content">
  <div class="content-wrapper">
    <div class="time-divider">
      <span class="time-label" id="timeLabel">加载中…</span>
      <span class="time-label" id="countLabel" style="margin-left:auto;color:var(--text-dim);font-weight:400;"></span>
      <div class="time-line"></div>
    </div>
    <div id="newsFeed"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function() {
  var data = window.FINHOT_DATA;
  var categories = window.CATEGORIES;
  var config = window.CATEGORY_CONFIG;

  // XSS protection
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    if (typeof value !== 'string' || !value.trim()) return '';
    try {
      var parsed = new URL(value, window.location.href);
      return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : '';
    } catch(e) {
      return '';
    }
  }

  // Pagination
  var PAGE_SIZE = 20;
  var currentFiltered = [];
  var currentPage = 0;

  var timeLabel = document.getElementById('timeLabel');
  var countLabel = document.getElementById('countLabel');
  var newsFeed = document.getElementById('newsFeed');
  var navFeatured = document.getElementById('navFeatured');

  // Fallback: if data.js failed to load
  if (!data || !Array.isArray(data.items) || !Array.isArray(categories) || !config) {
    timeLabel.textContent = '数据加载失败';
    var errorMessage = document.createElement('p');
    errorMessage.className = 'empty-message';
    errorMessage.textContent = '数据加载失败，请稍后刷新页面';
    newsFeed.replaceChildren(errorMessage);
    return;
  }

  // Featured threshold
  var featuredThreshold = 70;

  // Category bar — insert "精选" as first tab after "全部"
  var catBar = document.getElementById('categoryBar');

  function buildCategoryBar() {
    catBar.replaceChildren();
    categories.forEach(function(cat) {
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'cat-tab' + (cat.slug === 'featured' ? ' active' : '');
      tab.textContent = cat.label;
      tab.setAttribute('data-cat', cat.slug);
      tab.setAttribute('aria-pressed', cat.slug === 'featured' ? 'true' : 'false');
      tab.addEventListener('click', function() {
        activateTab(tab);
        renderFeed(cat.slug, false);
        navFeatured.classList.toggle('active', cat.slug === 'featured');
      });
      catBar.appendChild(tab);
      // "精选" tab comes from CATEGORIES data already, no need to insert manually
    });
  }

  function activateTab(tab) {
    var allTabs = document.querySelectorAll('.cat-tab');
    for (var i = 0; i < allTabs.length; i++) {
      allTabs[i].classList.remove('active');
      allTabs[i].setAttribute('aria-pressed', 'false');
    }
    tab.classList.add('active');
    tab.setAttribute('aria-pressed', 'true');
  }

  // Header nav "精选" click → show featured items
  navFeatured.addEventListener('click', function(e) {
    e.preventDefault();
    navFeatured.classList.add('active');
    var featuredTabEl = catBar.querySelector('.cat-tab[data-cat="featured"]');
    if (featuredTabEl) {
      activateTab(featuredTabEl);
    }
    renderFeed('featured', false);
  });

  // Other nav links remove featured highlight
  var otherNavLinks = document.querySelectorAll('.header-nav a:not(#navFeatured)');
  for (var n = 0; n < otherNavLinks.length; n++) {
    otherNavLinks[n].addEventListener('click', function() {
      navFeatured.classList.remove('active');
    });
  }

  buildCategoryBar();

  // Time label
  try {
    timeLabel.textContent = data.date || '今日';
  } catch(e) {
    timeLabel.textContent = '今日资讯';
  }

  function formatTime(iso) {
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var now = new Date();
      var diff = now - d;
      if (diff < 0) {
        d = new Date(iso.replace('Z', '+08:00'));
        diff = now - d;
      }
      if (diff < 0) return '';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    } catch(e) {
      return '';
    }
  }

  function createCard(item) {
    var safeUrl = safeHttpUrl(item.sourceUrl);
    var card = document.createElement(safeUrl ? 'a' : 'article');
    card.className = 'news-card';
    if (safeUrl) {
      card.href = safeUrl;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
    } else {
      card.classList.add('news-card-disabled');
    }

    var catCfg = config[item.category] || {};
    var allowedTagClasses = ['tag-regulatory', 'tag-products', 'tag-industry', 'tag-research', 'tag-insights'];
    var tagClass = allowedTagClasses.indexOf(catCfg.tagClass) >= 0 ? catCfg.tagClass : '';
    var tags = Array.isArray(item.tags) ? item.tags : [];
    var sourceTier = item.sourceTierLabel || item.sourceTier || '';
    var why = Array.isArray(item.why) ? item.why : [];
    var scoreTitle = item.scoreBreakdown
      ? '相关性 ' + item.scoreBreakdown.relevance + '/25，权威性 ' + item.scoreBreakdown.authority + '/20，业务影响 ' + item.scoreBreakdown.impact + '/20，时效 ' + item.scoreBreakdown.recency + '/15，深度 ' + item.scoreBreakdown.depth + '/10，可行动性 ' + item.scoreBreakdown.actionability + '/10'
      : '';
    var scoreBadge = item.score >= featuredThreshold
      ? '<span class="card-score card-score-featured" title="' + escapeHtml(scoreTitle) + '">' + escapeHtml(item.scoreLabel || '从业价值') + ' ' + item.score + '</span>'
      : '<span class="card-score" title="' + escapeHtml(scoreTitle) + '">' + escapeHtml(item.scoreLabel || '从业价值') + ' ' + item.score + '</span>';

    card.innerHTML =
      '<div class="card-meta">' +
        '<span class="card-time">' + formatTime(item.publishedAt) + '</span>' +
        '<span class="card-source">' + escapeHtml(item.sourceName || '') + '</span>' +
        (sourceTier ? '<span class="source-tier">' + escapeHtml(sourceTier) + '</span>' : '') +
        scoreBadge +
        '<span class="meta-spacer"></span>' +
      '</div>' +
      '<h2 class="card-title">' + escapeHtml(item.title || '') + '</h2>' +
      '<p class="card-summary">' + escapeHtml(item.summary || '') + '</p>' +
      (why.length ? '<div class="why-row">' + why.map(function(w) { return '<span class="why-chip">' + escapeHtml(w) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="tag-row">' +
        tags.map(function(t) { return '<span class="tag ' + tagClass + '">' + escapeHtml(t) + '</span>'; }).join('') +
      '</div>';

    return card;
  }

  function sortByTimeDesc(items) {
    return items.slice().sort(function(a, b) {
      var ta = new Date(a.publishedAt).getTime() || 0;
      var tb = new Date(b.publishedAt).getTime() || 0;
      return tb - ta;
    });
  }

  function renderFeed(filter, append) {
    if (!append) {
      newsFeed.replaceChildren();
      currentPage = 0;
      if (filter === 'all') {
        currentFiltered = data.items;
      } else if (filter === 'featured') {
        currentFiltered = data.items.filter(function(i) { return i.score >= featuredThreshold; });
      } else {
        currentFiltered = data.items.filter(function(i) { return i.category === filter; });
      }
      currentFiltered = sortByTimeDesc(currentFiltered);
      countLabel.textContent = currentFiltered.length + ' 条';
    }

    var start = currentPage * PAGE_SIZE;
    var end = start + PAGE_SIZE;
    var pageItems = currentFiltered.slice(start, end);
    pageItems.forEach(function(item) { newsFeed.appendChild(createCard(item)); });
    currentPage++;

    var oldBtn = document.getElementById('loadMoreBtn');
    if (oldBtn) oldBtn.remove();

    if (end < currentFiltered.length) {
      var btn = document.createElement('button');
      btn.id = 'loadMoreBtn';
      btn.className = 'load-more-btn';
      btn.textContent = '加载更多 (' + (currentFiltered.length - end) + ' 条)';
      btn.addEventListener('click', function() { renderFeed(null, true); });
      newsFeed.appendChild(btn);
    }

    if (currentFiltered.length === 0) {
      var emptyMessage = document.createElement('p');
      emptyMessage.className = 'empty-message';
      emptyMessage.textContent = '暂无相关资讯';
      newsFeed.replaceChildren(emptyMessage);
      countLabel.textContent = '';
    }
  }

  // Default state matches the highlighted header navigation.
  var initialTab = catBar.querySelector('.cat-tab[data-cat="featured"]');
  if (initialTab) activateTab(initialTab);
  renderFeed('featured');
})();
</script>

</body>
</html>
