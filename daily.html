<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金融保险日报 · finhot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="header-logo">finhot</a>
  <div class="header-spacer"></div>
  <nav class="header-nav">
    <a href="index.html">精选</a>
    <a href="daily.html" class="active">AI 日报</a>
    <a href="about.html">关于</a>
  </nav>
</header>

<div class="content">
  <div class="report-content">
    <div class="report-title-area">
      <h1 class="report-title">金融保险日报</h1>
      <p class="report-date" id="reportDate"></p>
      <p class="report-lead" id="reportLead"></p>
    </div>
    <div class="divider"></div>
    <div id="aiAnalysisArea"></div>
    <div class="divider"></div>
    <div id="reportSections"></div>
    <div class="divider"></div>
    <div id="flashSection"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function() {
  const data = window.FINHOT_DATA;
  const config = window.CATEGORY_CONFIG;

  // XSS protection
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Build item map for ID-based section resolution
  var itemMap = {};
  (data.items || []).forEach(function(item) { itemMap[item.id] = item; });

  // Resolve section items (supports both ID strings and legacy full objects)
  function resolveSectionItems(sectionData) {
    if (!sectionData || sectionData.length === 0) return [];
    if (typeof sectionData[0] === 'string') {
      return sectionData.map(function(id) { return itemMap[id]; }).filter(Boolean);
    }
    return sectionData; // legacy format: already full objects
  }

  document.getElementById('reportDate').textContent =
    new Date(data.date).toLocaleDateString('zh-CN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  document.getElementById('reportLead').textContent = data.lead;

  const sectionOrder = ['regulatory', 'products', 'industry', 'research', 'insights'];
  const sectionsEl = document.getElementById('reportSections');

  sectionOrder.forEach(slug => {
    var items = resolveSectionItems(data.sections[slug]);
    if (!items || items.length === 0) return;
    // Sort items within each section by time desc
    items = items.slice().sort(function(a, b) {
      var ta = new Date(a.publishedAt).getTime() || 0;
      var tb = new Date(b.publishedAt).getTime() || 0;
      return tb - ta;
    });
    const cfg = config[slug];

    const section = document.createElement('div');
    section.className = 'report-section';
    section.innerHTML = `
      <div class="section-header">
        <div class="accent-bar ${cfg.accentClass}"></div>
        <h2 class="section-title">${cfg.label}</h2>
      </div>
      ${items.map(item => `
        <div class="report-item">
          <h3 class="item-title">${escapeHtml(item.title)}</h3>
          <div class="item-meta">
            <span class="item-source">${escapeHtml(item.sourceName)}</span>
            <span class="item-time">${item.publishedAt}</span>
          </div>
        </div>
      `).join('')}
    `;
    sectionsEl.appendChild(section);
  });

  const flashSection = document.getElementById('flashSection');
  if (data.flashes && data.flashes.length > 0) {
    flashSection.className = 'flash-section';
    flashSection.innerHTML = `
      <h3 class="flash-head">快讯</h3>
      ${data.flashes.map(f => {
        var flashItem = f.id ? itemMap[f.id] : f;
        var title = flashItem ? flashItem.title : (f.title || '');
        var dotClass = f.dotClass || 'flash-dot-green';
        return '<div class="flash-item"><div class="flash-dot ' + dotClass + '"></div><p class="flash-text">' + escapeHtml(title.length > 60 ? title.substring(0, 60) + '…' : title) + '</p></div>';
      }).join('')}
    `;
  }
  // === AI Analysis Sections ===
  (function renderAIAnalysis(analysis) {
    if (!analysis) return;

    var sections = [
      {
        key: 'insurancePlanner',
        icon: '🛡',
        label: '保险规划师参考话术',
        accentClass: 'accent-ai-insurance',
        desc: analysis.insurancePlanner && analysis.insurancePlanner.summary ? analysis.insurancePlanner.summary : '暂无内容'
      },
      {
        key: 'peOperations',
        icon: '📊',
        label: '私募运营参考话术',
        accentClass: 'accent-ai-pe',
        desc: analysis.peOperations && analysis.peOperations.summary ? analysis.peOperations.summary : '暂无内容'
      },
      {
        key: 'marketOutlook',
        icon: '📈',
        label: '市场理解与展望',
        accentClass: 'accent-ai-market',
        desc: analysis.marketOutlook && analysis.marketOutlook.summary ? analysis.marketOutlook.summary : '暂无内容'
      }
    ];

    var container = document.getElementById('aiAnalysisArea');
    if (!container) return;

    var html = '';
    sections.forEach(function(sec) {
      var secData = analysis[sec.key];
      if (!secData) return;

      // talkingPoints for insurance & PE, outlooks for market
      var items = secData.talkingPoints || secData.outlooks || [];
      if (items.length === 0) return;

      html += '<div class="ai-section">';
      html += '  <div class="section-header">';
      html += '    <div class="accent-bar ' + sec.accentClass + '"></div>';
      html += '    <h2 class="section-title">' + sec.icon + ' ' + sec.label + '</h2>';
      html += '  </div>';
      html += '  <p class="ai-section-desc">' + escapeHtml(sec.desc) + '</p>';
      html += '  <div class="ai-points">';

      items.forEach(function(item) {
        var topic = escapeHtml(item.topic || '');
        var point = escapeHtml(item.point || item.content || '');
        var action = item.action ? escapeHtml(item.action) : '';

        html += '<div class="ai-point-card">';
        html += '  <div class="ai-point-topic">' + topic + '</div>';
        html += '  <div class="ai-point-body">' + point + '</div>';
        if (action) {
          html += '  <div class="ai-point-action"><span class="ai-action-label">建议行动</span>' + action + '</div>';
        }
        html += '</div>';
      });

      html += '  </div>';
      html += '</div>';
    });

    if (html) {
      container.innerHTML = html;
    }
  })(data.aiAnalysis);
})();
</script>

</body>
</html>
