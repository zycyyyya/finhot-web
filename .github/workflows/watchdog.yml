name: Monitor Scheduled Data Runs

on:
  workflow_dispatch:
  schedule:
    # GitHub-hosted schedules are best-effort and this repository commonly sees
    # 2-3.5 hour delays. Check each data slot after a four-hour grace window.
    - cron: "31 4,8,12,16 * * *"

concurrency:
  group: finhot-schedule-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect a missing scheduled run
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const {
              findMissingSchedule,
            } = require(path.join(
              process.env.GITHUB_WORKSPACE,
              'scripts',
              'schedule-watch.js'
            ));

            const fs = require('fs');
            const stateFile = path.join(
              process.env.GITHUB_WORKSPACE,
              'data',
              'alert-state.json'
            );
            let state = { scheduleRuns: {} };
            try {
              state = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
            } catch (error) {
              core.warning(`Unable to read alert state: ${error.message}`);
            }
            const graceMinutes = 240;
            const missing = findMissingSchedule(
              state.scheduleRuns || {},
              new Date().toISOString(),
              graceMinutes
            );
            const labelName = 'finhot-alert';
            const missingTitle = '[finhot-alert] 严重：定时采集任务未按窗口启动';
            const { data: openAlerts } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labelName,
              per_page: 100,
            }).catch(error => {
              if (error.status === 404) return { data: [] };
              throw error;
            });
            const missingAlerts = openAlerts.filter(issue => issue.title === missingTitle);
            if (!missing) {
              core.info('The latest expected data schedule has a matching run.');
              for (const issue of missingAlerts) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '监控已确认最新计划窗口存在成功记录，自动关闭历史缺失告警。',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
              }
              return;
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName,
                color: 'B60205',
                description: 'finhot 自动数据健康告警',
              });
            }

            const marker = `<!-- finhot-missing-schedule:${missing.expectedAt} -->`;
            const detail = [
              marker,
              '## finhot 定时任务缺失告警',
              '',
              `- 应触发时间：${missing.expectedAt}`,
              `- 对应 cron：${missing.schedule}`,
              `- 检查阈值：计划时间后 ${graceMinutes} 分钟`,
              `- Watchdog Run ID：${context.runId}`,
              '',
              '在阈值窗口内未查询到 `Validate and Update Data` 的 schedule 运行。',
              '请检查 GitHub Actions 调度状态；必要时手动触发主数据工作流。',
            ].join('\n');

            const existing = missingAlerts[0];
            if (existing) {
              if ((existing.body || '').includes(marker)) {
                core.info(`Missing schedule already reported in issue #${existing.number}.`);
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: detail,
              });
              core.info(`Updated existing missing-schedule issue #${existing.number}.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: missingTitle,
              body: detail,
              labels: [labelName],
            });
