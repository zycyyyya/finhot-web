<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金融保险日报 · finhot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="header-logo">finhot</a>
  <div class="header-spacer"></div>
  <nav class="header-nav">
    <a href="index.html">精选</a>
    <a href="daily.html" class="active">AI 日报</a>
    <a href="about.html">关于</a>
  </nav>
</header>

<div class="content">
  <div class="report-content">
    <div class="report-title-area">
      <h1 class="report-title">金融保险日报</h1>
      <p class="report-date" id="reportDate"></p>
      <p class="report-lead" id="reportLead"></p>
    </div>
    <div class="divider"></div>
    <div id="dailySummaryArea"></div>
    <div class="divider"></div>
    <div id="aiAnalysisArea"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function() {
  const data = window.FINHOT_DATA;

  // XSS protection
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHttpUrl(value) {
    if (typeof value !== 'string' || !value.trim()) return '';
    try {
      var parsed = new URL(value, window.location.href);
      return parsed.protocol === 'http:' || parsed.protocol === 'https:' ? parsed.href : '';
    } catch (e) {
      return '';
    }
  }

  var itemById = {};
  (data && Array.isArray(data.items) ? data.items : []).forEach(function(item) {
    if (item && item.id) itemById[item.id] = item;
  });

  function renderEvidence(ids) {
    var safeIds = Array.isArray(ids) ? ids.slice(0, 3) : [];
    var links = safeIds.map(function(id) {
      var item = itemById[id];
      var href = item ? safeHttpUrl(item.sourceUrl) : '';
      if (!item || !href) return '';
      return '<a class="evidence-link" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(item.sourceName || '原文') + '：' + escapeHtml((item.title || '').substring(0, 36)) + '</a>';
    }).filter(Boolean);
    if (links.length === 0) return '<div class="evidence-empty">未绑定原文依据</div>';
    return '<div class="evidence-box"><span class="evidence-label">原文依据</span>' + links.join('') + '</div>';
  }

  if (!data || !data.aiAnalysis) {
    document.getElementById('reportDate').textContent = '数据加载失败';
    document.getElementById('reportLead').textContent = '日报数据不可用，请稍后刷新页面。';
    return;
  }

  var reportDate = new Date(data.date);
  document.getElementById('reportDate').textContent = Number.isNaN(reportDate.getTime())
    ? (data.date || '日期未知')
    : reportDate.toLocaleDateString('zh-CN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  document.getElementById('reportLead').textContent = data.lead || '';

  // === Daily Summary (3-line takeaways) ===
  (function renderSummary(analysis) {
    var highlights = (analysis.dailySummary && analysis.dailySummary.highlights) ? analysis.dailySummary.highlights : [];
    if (highlights.length === 0) {
      document.getElementById('dailySummaryArea').innerHTML = '';
      return;
    }
    var html = '<div class="daily-highlights">';
    highlights.forEach(function(h) {
      var highlightText = typeof h === 'string' ? h : (h && h.text ? h.text : '');
      var highlightEvidence = h && typeof h === 'object' ? h.evidenceItemIds : [];
      html += '<div class="daily-highlight-item"><span class="highlight-dot"></span><div><span>' + escapeHtml(highlightText) + '</span>' + renderEvidence(highlightEvidence) + '</div></div>';
    });
    html += '</div>';
    document.getElementById('dailySummaryArea').innerHTML = html;
  })(data.aiAnalysis);

  // === AI Analysis Sections ===
  (function renderAIAnalysis(analysis) {
    if (!analysis) return;

    var sections = [
      {
        key: 'eventChain',
        icon: '🔗',
        label: '事件串联分析',
        accentClass: 'accent-ai-insurance',
        desc: analysis.eventChain && analysis.eventChain.summary ? analysis.eventChain.summary : '暂无事件关联分析',
        type: 'eventChain'
      },
      {
        key: 'industryImpact',
        icon: '🎯',
        label: '行业影响矩阵',
        accentClass: 'accent-ai-pe',
        desc: '按保险/私募/银行/信托四象限标注各条新闻的影响权重',
        type: 'industryImpact'
      },
      {
        key: 'weeklyTrends',
        icon: '📡',
        label: '本周趋势信号',
        accentClass: 'accent-ai-market',
        desc: analysis.weeklyTrends && analysis.weeklyTrends.summary ? analysis.weeklyTrends.summary : '暂无趋势信号',
        type: 'weeklyTrends'
      },
      {
        key: 'insurancePlanner',
        icon: '🛡',
        label: '保险规划师参考话术',
        accentClass: 'accent-ai-insurance',
        desc: analysis.insurancePlanner && analysis.insurancePlanner.summary ? analysis.insurancePlanner.summary : '暂无内容',
        type: 'talkingPoints'
      },
      {
        key: 'peOperations',
        icon: '📊',
        label: '私募运营参考话术',
        accentClass: 'accent-ai-pe',
        desc: analysis.peOperations && analysis.peOperations.summary ? analysis.peOperations.summary : '暂无内容',
        type: 'talkingPoints'
      },
      {
        key: 'marketOutlook',
        icon: '📈',
        label: '市场理解与展望',
        accentClass: 'accent-ai-market',
        desc: analysis.marketOutlook && analysis.marketOutlook.summary ? analysis.marketOutlook.summary : '暂无内容',
        type: 'talkingPoints'
      }
    ];

    var container = document.getElementById('aiAnalysisArea');
    if (!container) return;

    var totalHtml = '';
    sections.forEach(function(sec) {
      var secData = analysis[sec.key];
      if (!secData) return;

      var html = '';
      
      if (sec.type === 'eventChain') {
        var chains = secData.chains || [];
        if (chains.length === 0) return;
        html += '<div class="ai-section">';
        html += '  <div class="section-header">';
        html += '    <div class="accent-bar ' + escapeHtml(sec.accentClass) + '"></div>';
        html += '    <h2 class="section-title">' + sec.icon + ' ' + sec.label + '</h2>';
        html += '  </div>';
        html += '  <p class="ai-section-desc">' + escapeHtml(sec.desc) + '</p>';
        html += '  <div class="ai-points">';
        chains.forEach(function(chain) {
          html += '<div class="event-chain-card">';
          html += '  <div class="event-chain-title">' + escapeHtml(chain.title || '') + '</div>';
          html += '  <div class="event-chain-nodes">';
          var nodes = chain.nodes || [];
          nodes.forEach(function(node, i) {
            html += '<span class="event-chain-node">' + escapeHtml(node) + '</span>';
            if (i < nodes.length - 1) html += '<span class="event-chain-arrow">→</span>';
          });
          html += '  </div>';
          html += '  <div class="event-chain-causal">' + escapeHtml(chain.causalLink || '') + '</div>';
          html += renderEvidence(chain.evidenceItemIds);
          html += '</div>';
        });
        html += '  </div>';
        html += '</div>';
      } else if (sec.type === 'industryImpact') {
        var quadrants = secData.quadrants || {};
        var quadKeys = [
          { key: 'insurance', label: '保险', icon: '🛡' },
          { key: 'pe', label: '私募', icon: '📊' },
          { key: 'banking', label: '银行', icon: '🏦' },
          { key: 'trust', label: '信托/财富', icon: '💼' }
        ];
        // Check if any quadrant has content
        var hasAny = quadKeys.some(function(q) {
          var qd = quadrants[q.key];
          return qd && qd.level && qd.level !== 'none';
        });
        if (!hasAny) return;
        html += '<div class="ai-section">';
        html += '  <div class="section-header">';
        html += '    <div class="accent-bar ' + escapeHtml(sec.accentClass) + '"></div>';
        html += '    <h2 class="section-title">' + sec.icon + ' ' + sec.label + '</h2>';
        html += '  </div>';
        html += '  <p class="ai-section-desc">' + escapeHtml(sec.desc) + '</p>';
        html += '  <div class="impact-matrix">';
        quadKeys.forEach(function(q) {
          var qd = quadrants[q.key] || { level: 'none', summary: '暂无', items: [] };
          var safeLevel = ['high', 'medium', 'low', 'none'].indexOf(qd.level) >= 0 ? qd.level : 'none';
          html += '<div class="impact-quadrant">';
          html += '  <div class="impact-quadrant-header">';
          html += '    <span class="impact-level impact-level-' + safeLevel + '">' + safeLevel.toUpperCase() + '</span>';
          html += '    <span class="impact-quadrant-label">' + q.icon + ' ' + q.label + '</span>';
          html += '  </div>';
          if (qd.summary) {
            html += '  <div class="impact-quadrant-summary">' + escapeHtml(qd.summary) + '</div>';
          }
          var qItems = qd.items || [];
          if (qItems.length > 0) {
            html += '  <ul class="impact-quadrant-items">';
            qItems.forEach(function(it) {
              if (typeof it === 'string') {
                html += '<li>' + escapeHtml(it) + '</li>';
              } else if (typeof it === 'object' && it !== null) {
                html += '<li class="impact-item-object">';
                html += '  <div class="impact-item-title"><strong>' + escapeHtml(it.title || '') + '</strong></div>';
                if (it.impact) html += '  <div class="impact-item-impact">影响：' + escapeHtml(it.impact) + '</div>';
                if (it.suggestion) html += '  <div class="impact-item-suggestion">建议：' + escapeHtml(it.suggestion) + '</div>';
                html += renderEvidence(it.evidenceItemIds);
                html += '</li>';
              }
            });
            html += '  </ul>';
          }
          html += '</div>';
        });
        html += '  </div>';
        html += '</div>';
      } else if (sec.type === 'weeklyTrends') {
        var trends = secData.trends || [];
        if (trends.length === 0) {
          if (secData.summary && secData.summary !== '暂无趋势信号') {
            // Show summary-only section
          } else {
            return;
          }
        }
        html += '<div class="ai-section">';
        html += '  <div class="section-header">';
        html += '    <div class="accent-bar ' + escapeHtml(sec.accentClass) + '"></div>';
        html += '    <h2 class="section-title">' + sec.icon + ' ' + sec.label + '</h2>';
        html += '  </div>';
        html += '  <p class="ai-section-desc">' + escapeHtml(sec.desc) + '</p>';
        html += '  <div class="ai-points">';
        trends.forEach(function(trend) {
          var dirMap = { '\u4e0a\u5347': 'dir-up', '\u4e0b\u964d': 'dir-down', '\u5e73\u7a33': 'dir-stable' };
          var dirClass = dirMap[trend.direction] || 'dir-stable';
          html += '<div class="weekly-trend-card">';
          html += '  <div class="weekly-trend-topic">';
          html += '    <span class="weekly-trend-dir ' + dirClass + '">' + escapeHtml(trend.direction || '') + '</span>';
          html += '    <span style="font-size:14px;font-weight:600;color:var(--text-primary);">' + escapeHtml(trend.topic || '') + '</span>';
          html += '  </div>';
          html += '  <div class="weekly-trend-evidence">' + escapeHtml(trend.evidence || '') + '</div>';
          html += renderEvidence(trend.evidenceItemIds);
          html += '</div>';
        });
        html += '  </div>';
        html += '</div>';
      } else {
        // talkingPoints or outlooks
        var items = secData.talkingPoints || secData.outlooks || [];
        if (items.length === 0) return;

        html += '<div class="ai-section">';
        html += '  <div class="section-header">';
        html += '    <div class="accent-bar ' + escapeHtml(sec.accentClass) + '"></div>';
        html += '    <h2 class="section-title">' + sec.icon + ' ' + sec.label + '</h2>';
        html += '  </div>';
        html += '  <p class="ai-section-desc">' + escapeHtml(sec.desc) + '</p>';
        html += '  <div class="ai-points">';

        items.forEach(function(item) {
          var topic = escapeHtml(item.topic || '');
          var point = escapeHtml(item.point || item.content || '');
          var action = item.action ? escapeHtml(item.action) : '';

          html += '<div class="ai-point-card">';
          html += '  <div class="ai-point-topic">' + topic + '</div>';
          html += '  <div class="ai-point-body">' + point + '</div>';
          if (action) {
            html += '  <div class="ai-point-action"><span class="ai-action-label">建议行动</span>' + action + '</div>';
          }
          html += renderEvidence(item.evidenceItemIds);
          html += '</div>';
        });

        html += '  </div>';
        html += '</div>';
      }

      if (html) {
        totalHtml += html;
      }
    });

    if (totalHtml) {
      container.innerHTML = totalHtml;
    }
  })(data.aiAnalysis);
})();
</script>

</body>
</html>
