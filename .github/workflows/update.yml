name: Validate and Update Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

concurrency:
  group: finhot-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run validation tests
        run: npm run check

      - name: Fetch and validate data
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run fetch

      - name: Re-run validation after generation
        run: npm run check

      - name: Commit updated data when changed
        run: |
          if git diff --quiet -- data.js; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git commit -m "chore: update finhot data"
          git push
