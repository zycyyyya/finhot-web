<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>finhot — 金融保险圈精选资讯</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="header-logo">finhot</a>
  <div class="header-spacer"></div>
  <nav class="header-nav">
    <a href="index.html" class="active" id="navFeatured">精选</a>
    <a href="daily.html">AI 日报</a>
    <a href="about.html">关于</a>
  </nav>
</header>

<div class="category-bar" id="categoryBar"></div>

<div class="content">
  <div class="content-wrapper">
    <div class="time-divider">
      <span class="time-label" id="timeLabel">加载中…</span>
      <span class="time-label" id="countLabel" style="margin-left:auto;color:var(--text-dim);font-weight:400;"></span>
      <div class="time-line"></div>
    </div>
    <div id="newsFeed"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function() {
  var data = window.FINHOT_DATA;
  var categories = window.CATEGORIES;
  var config = window.CATEGORY_CONFIG;

  var timeLabel = document.getElementById('timeLabel');
  var countLabel = document.getElementById('countLabel');
  var newsFeed = document.getElementById('newsFeed');
  var navFeatured = document.getElementById('navFeatured');

  // Fallback: if data.js failed to load
  if (!data || !data.items) {
    timeLabel.textContent = '数据加载失败';
    newsFeed.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px;">数据加载失败，请稍后刷新页面</p>';
    return;
  }

  // Build featured items set (score >= 70)
  var featuredThreshold = 70;
  var featuredItems = data.items.filter(function(i) { return i.score >= featuredThreshold; });

  // Category bar — insert "精选" as first tab after "全部"
  var catBar = document.getElementById('categoryBar');

  function buildCategoryBar() {
    catBar.innerHTML = '';
    categories.forEach(function(cat) {
      var tab = document.createElement('span');
      tab.className = 'cat-tab' + (cat.slug === 'all' ? ' active' : '');
      tab.textContent = cat.label;
      tab.setAttribute('data-cat', cat.slug);
      tab.addEventListener('click', function() {
        activateTab(tab);
        renderFeed(cat.slug);
        // If switching away from featured, deactivate nav highlight
        navFeatured.classList.remove('active');
      });
      catBar.appendChild(tab);
      // Insert "精选" tab right after "全部"
      if (cat.slug === 'all') {
        var featuredTab = document.createElement('span');
        featuredTab.className = 'cat-tab';
        featuredTab.textContent = '精选';
        featuredTab.setAttribute('data-cat', 'featured');
        featuredTab.addEventListener('click', function() {
          activateTab(featuredTab);
          renderFeed('featured');
          navFeatured.classList.add('active');
        });
        catBar.appendChild(featuredTab);
      }
    });
  }

  function activateTab(tab) {
    var allTabs = document.querySelectorAll('.cat-tab');
    for (var i = 0; i < allTabs.length; i++) allTabs[i].classList.remove('active');
    tab.classList.add('active');
  }

  // Header nav "精选" click → show featured items
  navFeatured.addEventListener('click', function(e) {
    e.preventDefault();
    navFeatured.classList.add('active');
    var featuredTabEl = catBar.querySelector('.cat-tab[data-cat="featured"]');
    if (featuredTabEl) {
      activateTab(featuredTabEl);
    }
    renderFeed('featured');
  });

  // Other nav links remove featured highlight
  var otherNavLinks = document.querySelectorAll('.header-nav a:not(#navFeatured)');
  for (var n = 0; n < otherNavLinks.length; n++) {
    otherNavLinks[n].addEventListener('click', function() {
      navFeatured.classList.remove('active');
    });
  }

  buildCategoryBar();

  // Time label
  try {
    timeLabel.textContent = data.date || '今日';
  } catch(e) {
    timeLabel.textContent = '今日资讯';
  }

  function formatTime(iso) {
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      var now = new Date();
      var diff = now - d;
      if (diff < 0) {
        d = new Date(iso.replace('Z', '+08:00'));
        diff = now - d;
      }
      if (diff < 0) return '';
      if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
      if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    } catch(e) {
      return '';
    }
  }

  function openLink(url) {
    if (!url || url === '#') return;
    window.open(url, '_blank', 'noopener');
  }

  function createCard(item) {
    var card = document.createElement('div');
    card.className = 'news-card';
    card.setAttribute('role', 'link');
    card.setAttribute('tabindex', '0');
    card.style.cursor = 'pointer';

    card.addEventListener('click', function(e) {
      if (item.sourceUrl && item.sourceUrl !== '#') {
        openLink(item.sourceUrl);
      }
    });

    card.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && item.sourceUrl && item.sourceUrl !== '#') {
        openLink(item.sourceUrl);
      }
    });

    var catCfg = config[item.category] || {};
    var tags = item.tags || [];
    var scoreBadge = (item.score >= featuredThreshold) ? ('<span class="card-score">精选 ' + item.score + '</span>') : '';

    card.innerHTML =
      '<div class="card-meta">' +
        '<span class="card-time">' + formatTime(item.publishedAt) + '</span>' +
        '<span class="card-source">' + (item.sourceName || '') + '</span>' +
        scoreBadge +
        '<span class="meta-spacer"></span>' +
      '</div>' +
      '<h2 class="card-title">' + (item.title || '') + '</h2>' +
      '<p class="card-summary">' + (item.summary || '') + '</p>' +
      '<div class="tag-row">' +
        tags.map(function(t) { return '<span class="tag ' + (catCfg.tagClass || '') + '">' + t + '</span>'; }).join('') +
      '</div>';

    return card;
  }

  function renderFeed(filter) {
    newsFeed.innerHTML = '';
    var items;
    if (filter === 'all') {
      items = data.items;
    } else if (filter === 'featured') {
      items = data.items.filter(function(i) { return i.score >= featuredThreshold; });
    } else {
      items = data.items.filter(function(i) { return i.category === filter; });
    }
    items.forEach(function(item) { newsFeed.appendChild(createCard(item)); });
    countLabel.textContent = items.length + ' 条';
    if (items.length === 0) {
      newsFeed.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:40px;">暂无相关资讯</p>';
      countLabel.textContent = '';
    }
  }

  // Default: show all on first load
  renderFeed('all');
  countLabel.textContent = data.items.length + ' 条';
})();
</script>

</body>
</html>
